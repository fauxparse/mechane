name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mechane:mechane@localhost:5433/mechane
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: mechane
          POSTGRES_PASSWORD: mechane
          POSTGRES_DB: mechane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mechane -d mechane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Check generated GraphQL schema/types are up to date
        run: |
          pnpm codegen
          git diff --exit-code -- packages/graphql-schema/schema.graphql packages/graphql-schema/src/graphql-env.d.ts

      - name: Check generated studio route tree is up to date
        run: |
          pnpm --filter @mechane/studio build
          git diff --exit-code -- apps/studio/src/routeTree.gen.ts

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
