name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Check generated GraphQL schema/types are up to date
        run: |
          pnpm codegen
          git diff --exit-code -- packages/graphql-schema/schema.graphql packages/graphql-schema/src/graphql-env.d.ts

      - name: Check generated studio route tree is up to date
        run: |
          pnpm --filter @mechane/studio build
          git diff --exit-code -- apps/studio/src/routeTree.gen.ts
