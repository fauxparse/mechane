<!doctype html>
<!-- THROWAWAY PROTOTYPE — Image authoring flow, ticket 298. Remove after the design decision. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image authoring prototype — second pass</title>
<style>
:root{color-scheme:dark;--bg:#14131a;--panel:#1d1b25;--raised:#272331;--soft:#302a3e;--line:#423950;--text:#f8f4ff;--muted:#aaa2b9;--faint:#766d84;--accent:#d4b4ff;--purple:#a971ff;--green:#8de3b1;--amber:#f4ca83;--red:#ff9caa;font:14px Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-width:980px;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:58px 1fr 34px}.chrome{display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:#17151e}.brand{font-weight:800}.crumb,.sub,.hint{color:var(--muted);font-size:12px}.spacer{flex:1}.pill,.tag{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:11px}.workspace{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#302b3d 0 1px,transparent 1px),#17161f;background-size:22px 22px}.workspace:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgb(255 255 255/.025),transparent 45%)}.artboard{position:absolute;z-index:1;left:50%;top:50%;width:600px;height:390px;transform:translate(-50%,-50%);border:1px solid #655d78;background:#312d3e;box-shadow:0 18px 55px rgb(0 0 0/.35)}.art-label{position:absolute;top:-28px;left:0;color:var(--muted);font-size:12px}.art-image{position:absolute;left:112px;top:56px;width:376px;height:250px;overflow:hidden;border:2px solid var(--purple);background:#4c435d}.art-image.empty{display:grid;place-items:center;border-style:dashed;color:var(--muted)}.art-image img{display:block;width:100%;height:100%;object-fit:cover}.art-badge{position:absolute;bottom:-28px;left:0;color:var(--accent);font-size:12px}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--soft);color:var(--text);font-size:12px}.btn:hover{border-color:var(--accent)}.btn.primary{border-color:transparent;background:var(--purple);color:#180f25;font-weight:800}.btn.ghost{background:transparent}.btn.small{padding:6px 9px}.btn:disabled{cursor:default;opacity:.45}.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel)}.modal-backdrop{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgb(0 0 0/.62)}.modal{width:850px;max-height:calc(100vh - 110px);overflow:auto;border:1px solid #665977;border-radius:16px;background:var(--panel);box-shadow:0 28px 100px rgb(0 0 0/.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}h1,h2,h3,p{margin:0}h1{margin-top:5px;font-size:18px}h2{margin-top:5px;font-size:16px}.tabs{display:flex;gap:4px;padding:14px 22px 0;border-bottom:1px solid var(--line)}.tab{border:0;border-bottom:2px solid transparent;padding:10px 15px;background:transparent;color:var(--muted);font-size:12px;font-weight:750}.tab.active{border-color:var(--accent);color:var(--text)}.modal-body{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding:22px}.main-col,.side-col{display:flex;flex-direction:column;gap:13px}.upload-box{display:grid;place-items:center;min-height:235px;border:1px dashed #765f99;border-radius:12px;padding:26px;background:rgb(169 113 255/.07);text-align:center}.upload-box strong{display:block;font-size:15px}.upload-box .hint{display:block;max-width:290px;margin-top:7px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:15px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.dot.green{background:var(--green);box-shadow:0 0 11px rgb(141 227 177/.5)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.progress{height:5px;overflow:hidden;margin-top:9px;border-radius:99px;background:#3b3548}.progress i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .15s}.preview{position:relative;display:grid;place-items:center;height:330px;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:repeating-conic-gradient(#302b3d 0 25%,#272330 0 50%) 50%/18px 18px}.preview img{display:block;width:100%;height:100%;object-fit:cover}.preview img.processing{filter:blur(10px);transform:scale(1.08);opacity:.8}.crop-box{position:absolute;left:18%;top:14%;width:64%;height:68%;border:2px solid #fff;box-shadow:0 0 0 999px rgb(0 0 0/.42);cursor:grab;touch-action:none}.crop-box:active{cursor:grabbing}.handle{position:absolute;width:12px;height:12px;border:2px solid #1b1722;border-radius:3px;background:#fff;touch-action:none}.handle.nw{top:-7px;left:-7px;cursor:nwse-resize}.handle.n{top:-7px;left:calc(50% - 6px);cursor:ns-resize}.handle.ne{top:-7px;right:-7px;cursor:nesw-resize}.handle.e{top:calc(50% - 6px);right:-7px;cursor:ew-resize}.handle.se{right:-7px;bottom:-7px;cursor:nwse-resize}.handle.s{bottom:-7px;left:calc(50% - 6px);cursor:ns-resize}.handle.sw{bottom:-7px;left:-7px;cursor:nesw-resize}.handle.w{top:calc(50% - 6px);left:-7px;cursor:ew-resize}.crop-label{position:absolute;left:12px;top:12px;z-index:2;background:rgb(20 19 26/.82);border-radius:5px;padding:5px 7px;color:var(--text);font-size:10px}.section{border:1px solid var(--line);border-radius:10px;padding:13px;background:rgb(255 255 255/.018)}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.callout{border:1px solid #65567a;border-radius:9px;padding:11px;background:rgb(212 180 255/.06);color:var(--muted);font-size:11px;line-height:1.45}.callout strong{color:var(--text)}.dimension-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field-label{display:block;color:var(--muted);font-size:11px}.input{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:#17151e;color:var(--text)}.slider{width:100%;accent-color:var(--purple)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery-item{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:0;background:#332d41;text-align:left}.gallery-item.selected{border:2px solid var(--accent)}.gallery-item img{display:block;width:100%;height:100%;object-fit:cover}.gallery-item span{position:absolute;right:4px;bottom:4px;left:4px;overflow:hidden;border-radius:4px;padding:3px 4px;background:rgb(20 19 26/.85);color:var(--text);font-size:9px;text-overflow:ellipsis;white-space:nowrap}.gallery-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:10px}.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-top:1px solid var(--line)}.toast{position:fixed;top:76px;right:24px;z-index:30;border:1px solid #5b506f;border-radius:9px;padding:10px 13px;background:#24212f;color:var(--text);font-size:12px;box-shadow:0 18px 55px rgb(0 0 0/.35)}.footer{display:flex;align-items:center;padding:0 18px;border-top:1px solid var(--line);color:var(--faint);font-size:11px}.footer strong{color:var(--muted)}.switcher{position:fixed;right:50%;bottom:47px;z-index:25;display:flex;align-items:center;gap:10px;transform:translateX(50%);border:1px solid #635675;border-radius:999px;padding:7px 10px;background:#111016;box-shadow:0 8px 30px rgb(0 0 0/.45)}.switcher button{width:24px;height:24px;border:0;border-radius:50%;background:#2a2434;color:var(--text)}.switcher button:hover{background:var(--purple);color:#180f25}.switcher-label{min-width:145px;text-align:center;color:var(--muted);font-size:11px}.switcher-label strong{color:var(--text)}.sidebar{position:absolute;right:0;top:0;bottom:0;z-index:4;width:330px;overflow:auto;border-left:1px solid var(--line);background:var(--panel)}.sidebar-head{padding:18px;border-bottom:1px solid var(--line)}.sidebar .section{border:0;border-bottom:1px solid var(--line);border-radius:0}.tray{position:absolute;right:0;bottom:0;left:0;z-index:6;border-top:1px solid #665977;background:rgb(29 27 37/.97);box-shadow:0 -15px 45px rgb(0 0 0/.32)}.tray-inner{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:18px;padding:14px 28px}.tray-title{font-size:13px;font-weight:750}.tray-title small{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:400}.tray-gallery{display:flex;gap:8px;overflow:hidden}.tray-item{width:64px;height:48px;flex:0 0 auto;overflow:hidden;border:1px solid var(--line);border-radius:6px;padding:0;background:#332d41}.tray-item.selected{border:2px solid var(--accent)}.tray-item img{width:100%;height:100%;object-fit:cover}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
const images={mountain:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="#5f7fd1"/><stop offset="1" stop-color="#d9a5bc"/></linearGradient></defs><rect width="640" height="420" fill="url(#s)"/><circle cx="505" cy="90" r="48" fill="#ffe4ad"/><path d="M0 340 170 145 278 270 395 125 640 365V420H0Z" fill="#3e536c"/><path d="m90 260 80-115 48 59-30 24-20-20-37 51Z" fill="#eef1f6"/><path d="m270 275 125-150 105 133-60-46-47 46-35-31Z" fill="#ccd7e3"/><path d="M0 355c120-55 210-4 315-35 130-38 195-21 325 15v85H0Z" fill="#283d48"/></svg>'),poster:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" rx="16" fill="#d4b4ff"/><circle cx="200" cy="164" r="92" fill="#ff997e"/><path d="M83 310c38-73 196-84 241 0" fill="none" stroke="#181520" stroke-width="22"/><path d="M120 115c40-52 120-60 165 0" fill="none" stroke="#181520" stroke-width="18" stroke-linecap="round"/><text x="200" y="365" text-anchor="middle" fill="#181520" font-family="sans-serif" font-size="28" font-weight="700">SHOW POSTER</text></svg>'),texture:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#ff9caa"/><stop offset=".45" stop-color="#f4ca83"/><stop offset="1" stop-color="#8de3b1"/></linearGradient></defs><rect width="400" height="250" fill="url(#g)"/><circle cx="70" cy="70" r="95" fill="#fff" opacity=".15"/><circle cx="310" cy="185" r="135" fill="#fff" opacity=".14"/></svg>')};
const gallery=[{key:'mountain',name:'Mountain at dusk',width:1600,height:1050,image:images.mountain},{key:'poster',name:'Show poster',width:1200,height:1200,image:images.poster},{key:'texture',name:'Gradient texture',width:800,height:500,image:images.texture}];
const params=new URLSearchParams(location.search);let variant=['A','B','C'].includes(params.get('variant'))?params.get('variant'):'B';
const state={tab:'upload',stage:'choose',selected:null,progress:0,suggested:true,targetWidth:1200,targetHeight:800,crop:{x:18,y:14,w:64,h:68},toast:'',galleryPrompt:null,alt:'',drag:null};
const names={A:'Inspector tabs',B:'Focused dialog',C:'Asset tray'};const app=document.querySelector('#app');
function toast(message){state.toast=message;render();setTimeout(()=>{if(state.toast===message){state.toast='';render()}},1900)}
function setVariant(next){variant=next;history.replaceState({},'',`?variant=${variant}`);render()}
function cycle(dir){const keys=['A','B','C'];const i=keys.indexOf(variant);setVariant(keys[(i+dir+3)%3])}
function setTab(tab){state.tab=tab;state.galleryPrompt=null;state.stage=tab==='upload'?'choose':'gallery';render()}
function chooseUpload(){state.tab='upload';state.selected=null;state.galleryPrompt=null;state.stage='uploading';state.progress=0;render();let p=0;const timer=setInterval(()=>{p+=20;state.progress=p;if(p>=100){clearInterval(timer);state.stage='crop';state.selected=gallery[0];state.alt=gallery[0].name;render()}else render()},180)}
function retry(){chooseUpload();toast('Starting a new upload session')}
function cancel(){state.stage='cancelled';state.selected=null;state.progress=0;state.galleryPrompt=null;render();toast('Nothing was added to the gallery')}
function selectGallery(key){const item=gallery.find(x=>x.key===key);state.selected=item;state.alt=item.name;state.galleryPrompt=null;if(state.suggested&&(item.width>state.targetWidth||item.height>state.targetHeight)){state.galleryPrompt=true;state.stage='galleryPrompt';render();return}state.stage='ready';render();toast('Gallery Image Asset selected')}
function useAnother(){state.selected=null;state.stage='gallery';state.galleryPrompt=null;render()}
function uploadNew(){state.tab='upload';state.stage='choose';state.selected=null;state.galleryPrompt=null;render()}
function cropGallery(){state.stage='crop';state.tab='upload';state.galleryPrompt=null;render()}
function clearSuggestion(){state.suggested=!state.suggested;state.galleryPrompt=null;if(!state.selected)state.stage=state.tab==='upload'?'choose':'gallery';render()}
function apply(){if(state.stage==='crop'){state.stage='uploading';state.progress=0;render();let p=0;const timer=setInterval(()=>{p+=25;state.progress=p;if(p>=100){clearInterval(timer);state.stage='processing';render();setTimeout(()=>{state.stage='ready';render()},1100)}else render()},180);return}if(state.stage==='ready')toast(state.galleryPrompt?'':'Image Value assigned to Image Element')}
function imageInfo(){return state.selected?`${state.selected.width} × ${state.selected.height}`:'No image selected'}
function cropStyle(){return `left:${state.crop.x}%;top:${state.crop.y}%;width:${state.crop.w}%;height:${state.crop.h}%;`}
function cropPreview(){if(!state.selected)return `<div class="preview"><div class="upload-box"><strong>Choose an image to begin</strong><span class="hint">The crop box appears after you select a local file or a gallery asset.</span></div></div>`;const handles=['nw','n','ne','e','se','s','sw','w'].map(h=>`<i class="handle ${h}" onpointerdown="startPointer(event,'${h}')"></i>`).join('');return `<div class="preview" id="cropStage"><img class="${state.stage==='processing'?'processing':''}" src="${state.selected.image}" alt=""><div class="crop-box" style="${cropStyle()}" onpointerdown="startPointer(event,'move')"><span class="crop-label">${state.suggested?`${state.targetWidth} × ${state.targetHeight} · cover`:'Free crop'}</span>${handles}</div></div>`}
function status(){if(state.stage==='uploading')return `<div class="status"><i class="dot amber"></i>Uploading directly to storage…<span style="flex:1"></span>${state.progress}%</div><div class="progress"><i style="width:${state.progress}%"></i></div>`;if(state.stage==='processing')return `<div class="status"><i class="dot amber"></i>Processing and validating…</div>`;if(state.stage==='ready')return `<div class="status"><i class="dot green"></i>Ready to use</div>`;if(state.stage==='cancelled')return `<div class="status"><i class="dot"></i>Cancelled <button class="btn small" onclick="retry()">Choose again</button></div>`;if(state.stage==='error')return `<div class="status"><i class="dot red"></i>Upload failed <button class="btn small" onclick="retry()">Retry</button></div>`;return ''}
function tabs(){return `<div class="tabs"><button class="tab ${state.tab==='upload'?'active':''}" onclick="setTab('upload')">Upload</button><button class="tab ${state.tab==='gallery'?'active':''}" onclick="setTab('gallery')">Gallery <span class="tag">${gallery.length}</span></button></div>`}
function uploadTab(){if(state.stage==='choose')return `<div class="upload-box"><div><strong>Upload an image</strong><span class="hint">Choose a local file. You will crop and resize it before anything is uploaded or added to the gallery.</span><div class="actions"><button class="btn primary" onclick="chooseUpload()">Choose image</button><button class="btn" onclick="setTab('gallery')">Browse gallery</button></div></div></div>`;if(state.stage==='crop'||state.stage==='uploading'||state.stage==='processing'||state.stage==='ready')return `${cropPreview()}${status()}<div class="section"><div class="section-title"><span>Transform</span><span class="tag">${state.suggested?'cover ratio locked':'free crop'}</span></div><div class="dimension-grid"><label class="field-label">Width<input class="input" type="number" value="${state.targetWidth}" onchange="state.targetWidth=Math.max(1,Number(this.value));render()"></label><label class="field-label">Height<input class="input" type="number" value="${state.targetHeight}" onchange="state.targetHeight=Math.max(1,Number(this.value));render()"></label></div><p class="hint" style="margin-top:9px">${state.suggested?'Suggested dimensions are defaults. Drag the crop box or handles to adjust.':'No suggested dimensions: crop freely.'}</p><button class="btn small ghost" style="margin-top:9px" onclick="clearSuggestion()">${state.suggested?'Try free crop':'Restore suggested ratio'}</button></div><label class="field-label">Alt text<input class="input" value="${state.alt}" oninput="state.alt=this.value"></label>`;return `<div class="callout"><strong>Upload cancelled.</strong><br>Choose another image or switch to Gallery.</div>`}
function galleryTab(){if(state.galleryPrompt)return `<div class="callout"><strong>${state.selected.name} is larger than the suggested ${state.targetWidth} × ${state.targetHeight}.</strong><br><span>Choose what to do before changing the Image Element.</span><div class="actions"><button class="btn primary" onclick="cropGallery()">Crop / resize to fit</button><button class="btn" onclick="useAnother()">Choose another image</button><button class="btn" onclick="uploadNew()">Upload new</button></div></div>${galleryGrid()}`;return `<div class="callout"><strong>Reuse an Image Asset.</strong><br>Assets at or below the suggested dimensions apply immediately. Larger assets ask before transforming.</div>${galleryGrid()}`}
function galleryGrid(){return `<div class="gallery">${gallery.map(item=>`<button class="gallery-item ${state.selected?.key===item.key?'selected':''}" onclick="selectGallery('${item.key}')"><img src="${item.image}" alt=""><span>${item.name}</span></button>`).join('')}</div><div class="gallery-meta"><span>${state.selected?state.selected.name:'Select an asset'}</span><span>${imageInfo()}</span></div>`}
function dialog(){const ready=state.stage==='ready';const canApply=ready||state.stage==='crop';return `<div class="modal-backdrop"><section class="modal"><div class="modal-head"><div><div class="eyebrow">Add Image Value</div><h2>Hero image</h2><p class="sub">Choose a new upload or reuse an existing Show asset.</p></div><button class="btn small ghost" onclick="cancel()">Close</button></div>${tabs()}<div class="modal-body"><main class="main-col">${state.tab==='upload'?uploadTab():galleryTab()}</main><aside class="side-col"><div class="callout"><strong>${state.suggested?'Suggested dimensions':'No suggested dimensions'}</strong><br>${state.suggested?`${state.targetWidth} × ${state.targetHeight} · cover crop`:'The crop box is freeform'}<br><span>From Image Variable: Hero image</span></div>${state.tab==='upload'&&state.stage!=='choose'?'<div class="section"><div class="section-title"><span>Current asset</span></div><p class="value">'+(state.selected?.name??'Pending upload')+'</p><p class="hint" style="margin-top:5px">'+imageInfo()+'</p></div>':''}<label class="field-label">Element alt override<input class="input" value="${state.alt}" oninput="state.alt=this.value"><span class="hint" style="display:block;margin-top:5px">Empty falls back to asset alt.</span></label></aside></div><div class="modal-foot"><span class="sub">${ready?'Ready. Apply to the selected Image Element.':state.stage==='galleryPrompt'?'This asset needs a decision before it can be used.':'The Image Element is unchanged until apply.'}</span><div class="actions"><button class="btn" onclick="cancel()">Cancel</button><button class="btn primary" onclick="apply()" ${canApply?'':'disabled'}>${state.tab==='gallery'&&state.stage==='ready'?'Use Image Value':state.stage==='crop'?'Upload & apply':'Apply Image Value'}</button></div></div></section></div>`}
function artboard(){const has=state.selected&&state.stage==='ready';return `<div class="artboard"><div class="art-label">Scene / Lobby · Canvas</div><div class="art-image ${has?'':'empty'}">${has?`<img src="${state.selected.image}" alt="${state.alt}">`:'<span>Image Element</span>'}<div class="art-badge">Image Element · selected</div></div></div>`}
function shellA(){return `<div class="workspace">${artboard()}<aside class="sidebar"><div class="sidebar-head"><div class="eyebrow">Image Element</div><h1>Hero image</h1><p class="sub">The revised tabs stay in the inspector when the modal feels too heavy.</p></div>${tabs()}<div class="section">${state.tab==='upload'?uploadTab():galleryTab()}</div><div class="section"><button class="btn primary" style="width:100%" onclick="apply()" ${state.stage==='ready'||state.stage==='crop'?'':'disabled'}>Apply Image Value</button></div></aside></div>`}
function shellB(){return `<div class="workspace">${artboard()}${dialog()}</div>`}
function shellC(){return `<div class="workspace">${artboard()}<div class="tray"><div class="tray-inner"><div class="tray-title">Image Element<small>${state.stage==='ready'?'Ready to apply':'Choose or reuse an image'}</small></div><div class="tray-gallery"><button class="btn small" onclick="setTab('upload')">Upload</button><button class="btn small" onclick="setTab('gallery')">Gallery</button>${gallery.map(item=>`<button class="tray-item ${state.selected?.key===item.key?'selected':''}" onclick="selectGallery('${item.key}')"><img src="${item.image}" alt="${item.name}"></button>`).join('')}</div><button class="btn primary" onclick="setTab('upload')">Open picker</button></div>${state.tab==='upload'||state.tab==='gallery'?dialog():''}</div>`}
function render(){const body=variant==='A'?shellA():variant==='B'?shellB():shellC();app.innerHTML=`<div class="app"><header class="chrome"><strong class="brand">Mechanē</strong><span class="crumb">Hamlet / Scenes / Lobby</span><span class="spacer"></span><span class="pill">Draft</span><span class="pill">Prototype only</span></header>${body}<footer class="footer"><strong>Question:</strong>&nbsp; what should the upload/gallery/crop flow feel like in the Canvas Editor?</footer><nav class="switcher"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><div class="switcher-label"><strong>${variant}</strong> — ${names[variant]}</div><button onclick="cycle(1)" aria-label="Next variant">→</button></nav>${state.toast?`<div class="toast">${state.toast}</div>`:''}</div>`}
function startPointer(event,mode){event.preventDefault();event.stopPropagation();const stage=document.querySelector('#cropStage');if(!stage)return;const rect=stage.getBoundingClientRect();state.drag={mode,startX:event.clientX,startY:event.clientY,initial:{...state.crop},stageWidth:rect.width,stageHeight:rect.height};document.addEventListener('pointermove',movePointer);document.addEventListener('pointerup',endPointer,{once:true})}
function movePointer(event){if(!state.drag)return;const d=state.drag;const dx=(event.clientX-d.startX)/d.stageWidth*100;const dy=(event.clientY-d.startY)/d.stageHeight*100;let c={...d.initial};if(d.mode==='move'){c.x=Math.max(0,Math.min(100-c.w,d.initial.x+dx));c.y=Math.max(0,Math.min(100-c.h,d.initial.y+dy))}else{const h=d.mode;const ratio=state.targetWidth/state.targetHeight;const scale=d.stageWidth/d.stageHeight;if(h.includes('e'))c.w=Math.max(12,Math.min(100-c.x,d.initial.w+dx));if(h.includes('s'))c.h=Math.max(12,Math.min(100-c.y,d.initial.h+dy));if(h.includes('w')){const next=Math.max(12,Math.min(d.initial.x+d.initial.w,d.initial.w-dx));c.x=d.initial.x+d.initial.w-next;c.w=next}if(h.includes('n')){const next=Math.max(12,Math.min(d.initial.y+d.initial.h,d.initial.h-dy));c.y=d.initial.y+d.initial.h-next;c.h=next}if(state.suggested){if(h.includes('e')||h.includes('w'))c.h=Math.min(100-c.y,Math.max(12,c.w*scale/ratio));else c.w=Math.min(100-c.x,Math.max(12,c.h*ratio/scale));if(h.includes('n'))c.y=d.initial.y+d.initial.h-c.h;if(h.includes('w'))c.x=d.initial.x+d.initial.w-c.w}}state.crop=c;const el=document.querySelector('.crop-box');if(el)el.style.cssText=`left:${c.x}%;top:${c.y}%;width:${c.w}%;height:${c.h}%;`}
function endPointer(){state.drag=null;document.removeEventListener('pointermove',movePointer);render()}
document.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;event.preventDefault();cycle(event.key==='ArrowRight'?1:-1)});render();
</script>
</body>
</html>
