<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype: Cue presentation comparison</title>
    <style>
      :root { color-scheme: dark; --bg:#111318; --panel:#1a1d24; --panel2:#222630; --panel3:#2c3340; --line:#3d4654; --text:#f2f4f8; --muted:#9da6b5; --blue:#91b9ff; --blue2:#d9e7ff; --green:#77d6aa; --purple:#cbaeff; --yellow:#f2cb7b; --shadow:0 22px 70px #0008; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 15% 0,#252d3b 0,var(--bg) 40rem); } button,select,input { font:inherit; } button { border:0; color:inherit; cursor:pointer; }
      .shell { min-height:100vh; padding:32px 24px 112px; } .flag { position:fixed; z-index:9; top:13px; left:50%; transform:translateX(-50%); border-radius:999px; padding:5px 12px; color:#181b22; background:var(--yellow); font:700 10px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; box-shadow:0 5px 18px #0006; }
      .model-note { max-width:1260px; margin:0 auto 13px; border:1px solid #586577; border-radius:10px; padding:10px 14px; color:var(--muted); background:#1b2029; font-size:11px; line-height:1.5; } .model-note b { color:var(--blue2); }
      .frame { max-width:1260px; min-height:700px; margin:0 auto; display:grid; grid-template-columns:180px minmax(500px,1fr) 380px; overflow:hidden; border:1px solid var(--line); border-radius:17px; background:#15181f; box-shadow:var(--shadow); }
      .rail { padding:22px 14px; border-right:1px solid var(--line); background:#171a21; } .rail h1 { margin:0 0 26px; font-size:14px; } .rail p { margin:0 0 24px; color:var(--muted); font-size:10px; line-height:1.45; } .eyebrow { color:var(--muted); font:700 10px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; }
      .rail-item { display:flex; align-items:center; gap:9px; width:100%; margin:5px 0; padding:9px 10px; border-radius:8px; color:var(--muted); text-align:left; background:transparent; } .rail-item.active { color:var(--text); background:var(--panel3); } .rail-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); } .active .rail-dot { background:var(--blue); }
      .work { position:relative; padding:22px; overflow:hidden; background:linear-gradient(135deg,#202632,#171a20 72%); } .work-head { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; } .work-head strong { color:var(--text); font-size:13px; }
      .graph { position:relative; min-height:490px; margin-top:38px; border:1px solid #566273; border-radius:11px; background:#181c24; } .grid { position:absolute; inset:0; opacity:.35; background-image:linear-gradient(#536071 1px,transparent 1px),linear-gradient(90deg,#536071 1px,transparent 1px); background-size:28px 28px; }
      .node { position:absolute; z-index:2; border:1px solid #596577; border-radius:10px; background:var(--panel); box-shadow:0 12px 24px #0005; } .cue-node { left:7%; top:18%; width:248px; } .scene-node { right:8%; top:9%; width:166px; } .source-node { right:8%; bottom:11%; width:166px; } .node-head { display:flex; align-items:center; justify-content:space-between; padding:10px 11px; border-bottom:1px solid var(--line); } .node-head small { color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.08em; } .node-head strong { display:block; margin-top:3px; font-size:12px; }
      .cue-row { display:grid; grid-template-columns:1fr 18px; gap:8px; align-items:center; padding:10px 11px; border-bottom:1px solid #303743; } .cue-row:last-child { border-bottom:0; } .cue-row.active { background:#91b9ff12; } .cue-row strong { display:block; font-size:11px; } .cue-row small { display:block; margin-top:3px; color:var(--muted); font-size:9px; } .handle { width:13px; height:13px; border:2px solid var(--blue); border-radius:50%; background:var(--panel); }
      .edge { position:absolute; z-index:1; height:2px; transform-origin:left center; background:var(--blue); } .edge:after { content:""; position:absolute; right:-1px; top:-4px; border-left:8px solid var(--blue); border-top:5px solid transparent; border-bottom:5px solid transparent; } .edge.nav { left:29%; top:29%; width:40%; transform:rotate(-14deg); } .edge.value { left:29%; top:48%; width:41%; transform:rotate(17deg); background:var(--purple); } .edge.value:after { border-left-color:var(--purple); } .edge-label { position:absolute; z-index:3; border-radius:5px; padding:4px 6px; color:#1c2b45; background:var(--blue2); font:700 9px ui-monospace,monospace; } .edge-label.nav { left:51%; top:20%; } .edge-label.value { left:54%; top:57%; color:#2a2040; background:#e8dbff; }
      .inspector { min-width:0; border-left:1px solid var(--line); background:var(--panel); } .head { display:flex; align-items:flex-start; justify-content:space-between; padding:20px; border-bottom:1px solid var(--line); } h2 { margin:7px 0 0; font-size:16px; } .close { width:27px; height:27px; border-radius:7px; color:var(--muted); background:transparent; } .body { padding:17px 20px; } .section { margin:0 0 17px; padding:0 0 17px; border-bottom:1px solid var(--line); } .section-title { display:flex; justify-content:space-between; margin-bottom:11px; font-size:12px; font-weight:700; } .section-title span { color:var(--muted); font-size:10px; font-weight:500; }
      .info { border-radius:8px; padding:10px; color:var(--muted); background:var(--panel2); font-size:10px; line-height:1.5; } .info b { color:var(--text); } .badge { display:inline-block; border-radius:5px; padding:3px 5px; color:#1c2b45; background:var(--blue2); font:700 9px ui-monospace,monospace; } .badge.purple { color:#2a2040; background:#e8dbff; } .row { display:flex; align-items:center; gap:8px; } .row > *:first-child { flex:1; }
      label { display:block; margin:11px 0 5px; color:var(--muted); font-size:10px; } select,input { width:100%; border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:var(--text); background:var(--panel2); outline:none; } select:focus,input:focus,button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; } .primary,.quiet { border-radius:7px; padding:8px 10px; font-size:10px; font-weight:700; } .primary { color:#18233a; background:var(--blue); } .quiet { color:var(--blue2); background:#91b9ff1a; }
      .edge-card { display:grid; grid-template-columns:25px 1fr auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:9px; background:var(--panel2); } .edge-card + .edge-card { margin-top:8px; } .edge-symbol { display:grid; place-items:center; width:23px; height:23px; border-radius:6px; color:#18233a; background:var(--blue); font:800 11px ui-monospace,monospace; } .edge-symbol.source { color:#2a2040; background:var(--purple); } .edge-card strong { display:block; font-size:11px; } .edge-card small { display:block; margin-top:3px; color:var(--muted); font-size:9px; }
      .state { position:absolute; left:22px; bottom:20px; max-width:300px; border:1px solid #566273; border-radius:8px; padding:10px 12px; color:#536071; background:#edf1f7; font:10px/1.45 ui-monospace,monospace; } .state b { color:#293548; }
      .variant-b .frame { grid-template-columns:180px minmax(500px,1fr) 405px; } .variant-b .cue-node { left:15%; top:26%; } .variant-b .scene-node { right:9%; top:16%; } .variant-b .source-node { right:9%; bottom:16%; } .variant-b .edge.nav { left:36%; top:35%; width:34%; transform:rotate(-11deg); } .variant-b .edge.value { left:36%; top:50%; width:34%; transform:rotate(11deg); } .variant-b .edge-label.nav { left:55%; top:28%; } .variant-b .edge-label.value { left:55%; top:56%; }
      .variant-c .frame { grid-template-columns:180px minmax(500px,1fr) 420px; } .variant-c .cue-node { left:7%; top:11%; width:286px; } .variant-c .scene-node { right:8%; top:13%; } .variant-c .source-node { right:8%; bottom:13%; } .variant-c .edge.nav { left:35%; top:29%; width:34%; transform:rotate(-11deg); } .variant-c .edge.value { left:35%; top:53%; width:35%; transform:rotate(13deg); } .variant-c .edge-label.nav { left:53%; top:22%; } .variant-c .edge-label.value { left:56%; top:60%; }
      @media (max-width:980px) { .shell { padding:22px 11px 100px; } .model-note { font-size:10px; } .frame { grid-template-columns:1fr; } .rail { display:none; } .work { min-height:670px; } .inspector { border-left:0; border-top:1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div class="flag">Prototype · comparative · throwaway</div><main id="app" class="shell"></main>
    <script>
      const variants = [
        { key:"A", name:"Graph-first Cue rows", tradeoff:"Maximum graph visibility; Canvas Inspector stays focused on the binding." },
        { key:"B", name:"Cue-focused graph panel", tradeoff:"Keeps the graph compact; selecting a Cue opens its owned Actions beside it." },
        { key:"C", name:"Canvas-to-graph bridge", tradeoff:"Starts from the Element Inspector; one action moves the author into the graph." },
      ];
      const state = { variant:new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A", cue:"Submit vote", binding:true, navTarget:"Results", sourceTarget:"voteCount", sourceMode:"increment", owner:"Scene · Voting", message:"Selected Cue: Submit vote" };
      if (!variants.some((variant)=>variant.key===state.variant)) state.variant="A";
      const esc=(value)=>String(value).replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
      function setVariant(key){state.variant=key;const url=new URL(location.href);url.searchParams.set("variant",key);history.replaceState(null,"",url);render();}
      function cycle(delta){const index=variants.findIndex((variant)=>variant.key===state.variant);setVariant(variants[(index+delta+variants.length)%variants.length].key);}
      function act(name){if(name==="toggle-binding"){state.binding=!state.binding;state.message=state.binding?"Tap binding restored":"Binding removed; Cue remains owned by the Scene";}if(name==="new-cue"){state.cue="New cue";state.message="Cue created in current owner";}if(name==="toggle-mode"){state.sourceMode=state.sourceMode==="increment"?"set":"increment";state.message=`Source Action behavior: ${state.sourceMode}`;}if(name==="block"){state.owner="Block · VoteCard";state.message="Block Cue inherited by Slot; Actions remain Cue-owned";}render();}
      function graph(){return `<div class="graph"><div class="grid"></div><div class="edge nav"></div><div class="edge value"></div><div class="edge-label nav">Navigate Action</div><div class="edge-label value">${esc(state.sourceMode)} Action</div><div class="node cue-node"><div class="node-head"><div><small>Cue node · owns Actions</small><strong>${esc(state.owner.startsWith("Block")?"VoteCard cues":"Voting cues")}</strong></div><button class="quiet" data-action="new-cue">+ Cue</button></div><div class="cue-row active"><div><strong>${esc(state.cue)}</strong><small>tap binding · 2 owned Actions</small></div><i class="handle" aria-label="Submit vote outgoing handle"></i></div><div class="cue-row"><div><strong>Cancel vote</strong><small>tap binding · 0 owned Actions</small></div><i class="handle" aria-label="Cancel vote outgoing handle"></i></div></div><div class="node scene-node"><div class="node-head"><div><small>Scene</small><strong>${esc(state.navTarget)}</strong></div></div><div class="cue-row"><div><strong>Incoming Navigate</strong><small>Action owned by ${esc(state.cue)}</small></div></div></div><div class="node source-node"><div class="node-head"><div><small>Source</small><strong>${esc(state.sourceTarget)}</strong></div></div><div class="cue-row"><div><strong>${esc(state.sourceMode)} value</strong><small>Action owned by ${esc(state.cue)}</small></div></div></div><div class="state"><b>Same model in every variant</b><br />Cue owns ordered Actions<br />binding=${state.binding} · owner=${esc(state.owner)}<br />last=${esc(state.message)}</div></div>`;}
      function head(title,subtitle){return `<div class="head"><div><div class="eyebrow">${subtitle}</div><h2>${title}</h2></div><button class="close" aria-label="Close inspector">×</button></div>`;}
      function canvasBinding(){return `<div class="section"><div class="section-title">Event Binding <span>${state.binding?"tap":"unbound"}</span></div><div class="info"><span class="badge">tap</span> on Vote button → <b>${esc(state.cue)}</b><br />Owner derives from Canvas: <b>${esc(state.owner)}</b></div><div class="row" style="margin-top:10px"><button class="primary" data-action="toggle-binding">${state.binding?"Remove binding":"Bind tap"}</button><button class="quiet" data-action="new-cue">New Cue</button></div></div>`;}
      function variantA(){return `<section class="inspector">${head("Vote button","Canvas Inspector")}<div class="body">${canvasBinding()}<div class="section"><div class="section-title">Cue <span>open in Show graph</span></div><div class="info"><b>${esc(state.cue)}</b> owns the outgoing Action rows. The Canvas Inspector defines the binding and Cue identity; behavior stays in the graph.</div><button class="quiet" style="margin-top:10px">Focus Cue in graph</button></div><div class="section"><div class="section-title">Block extension <span>same presentation</span></div><div class="info"><span class="badge purple">Block</span> Cues are authored once and inherited by Slots. No per-instance Action editor.</div><button class="quiet" style="margin-top:10px" data-action="block">Preview Block owner</button></div></div></section>`;}
      function variantB(){return `<section class="inspector">${head(state.cue,"Cue selected in Show graph")}<div class="body"><div class="section"><div class="section-title">Cue <span>owns 2 Actions</span></div><div class="info"><b>${esc(state.cue)}</b> · ${esc(state.owner)}<br />The rows below are the Cue's ordered Actions. The graph edges are their visual connections, not separate records.</div></div><div class="section"><div class="section-title">Outgoing Actions <span>owned by Cue</span></div><div class="edge-card"><div class="edge-symbol">→</div><div><strong>${esc(state.navTarget)}</strong><small>Navigate Action · Cue → Scene</small></div><button class="quiet">Select</button></div><div class="edge-card"><div class="edge-symbol source">S</div><div><strong>${esc(state.sourceTarget)}</strong><small>${esc(state.sourceMode)} Action · Cue → Source</small></div><button class="quiet" data-action="toggle-mode">${esc(state.sourceMode)}</button></div><button class="primary" style="margin-top:12px">Add Action edge</button></div><div class="section"><div class="section-title">Define from either inspector</div><div class="info">Canvas Inspector: bind Element → Cue. Show Graph Inspector: create or rename Cue → Actions.</div><button class="quiet" style="margin-top:10px" data-action="new-cue">New Cue</button></div></div></section>`;}
      function variantC(){return `<section class="inspector">${head("Vote button","Canvas Inspector")}${canvasBinding()}<div class="body"><div class="section"><div class="section-title">Behavior <span>owned by ${esc(state.cue)}</span></div><div class="info">The Element Inspector never edits Actions. It gives one clear bridge to the Show graph, where the Cue row and outgoing handles are edited.</div><button class="primary" style="margin-top:10px">Edit behavior in Show graph</button><button class="quiet" style="margin:8px 0 0" data-action="new-cue">Create Cue here</button></div><div class="section"><div class="section-title">Block inheritance <span>Slot boundary</span></div><div class="info"><span class="badge purple">Block</span> When this Element belongs to a Block, its Cue and owned Actions travel with the Block into every Slot.</div><button class="quiet" style="margin-top:10px" data-action="block">Preview Block owner</button></div></div></section>`;}
      function render(){const variant=variants.find((item)=>item.key===state.variant);const inspector=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();document.querySelector("#app").innerHTML=`<div class="model-note"><b>Same interaction model in all three versions:</b> a Cue owns its ordered Actions. Each outgoing handle is only the graph presentation of one owned Action. Cue → Scene is Navigate; Cue → Source carries the value behavior.</div><div class="frame variant-${state.variant.toLowerCase()}"><aside class="rail"><h1>Mechanē</h1><p>Show / Navigation Proof</p><button class="rail-item"><i class="rail-dot"></i>Show graph</button><button class="rail-item active"><i class="rail-dot"></i>Canvas</button><button class="rail-item"><i class="rail-dot"></i>Runs</button><div style="height:24px"></div><div class="eyebrow">Artboards</div><button class="rail-item active" style="margin-top:10px"><i class="rail-dot"></i>Voting</button><button class="rail-item"><i class="rail-dot"></i>VoteCard</button></aside><section class="work"><div class="work-head"><div><strong>${variant.key} · ${variant.name}</strong><br /><span>${variant.tradeoff}</span></div><span>Draft</span></div>${graph()}</section>${inspector}</div><div class="switcher"><button data-cycle="-1" aria-label="Previous variant">‹</button><div class="switch-label">${variant.key} · ${variant.name}<br /><span>← / → to compare</span></div><button data-cycle="1" aria-label="Next variant">›</button></div>`;document.querySelectorAll("[data-action]").forEach((button)=>button.addEventListener("click",()=>act(button.dataset.action)));}
      document.addEventListener("keydown",(event)=>{const tag=document.activeElement?.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||document.activeElement?.isContentEditable)return;if(event.key==="ArrowLeft"){event.preventDefault();cycle(-1);}if(event.key==="ArrowRight"){event.preventDefault();cycle(1);}});document.addEventListener("click",(event)=>{const button=event.target.closest("[data-cycle]");if(button)cycle(Number(button.dataset.cycle));});render();
    </script>
  </body>
</html>
