<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype: Cue graph authoring</title>
    <style>
      :root { color-scheme: dark; --bg:#111318; --panel:#1a1d24; --panel2:#222630; --panel3:#2b303c; --line:#3b4350; --text:#f2f4f8; --muted:#9da6b5; --blue:#91b9ff; --blue2:#d7e6ff; --green:#74d3a6; --yellow:#f2cb7b; --purple:#c8a6ff; --shadow:0 24px 70px #0008; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--text); background:radial-gradient(circle at 15% 0,#252c3a 0,var(--bg) 40rem); } button,select,input { font:inherit; } button { border:0; color:inherit; cursor:pointer; }
      .shell { min-height:100vh; padding:30px 28px 105px; } .flag { position:fixed; z-index:4; top:13px; left:50%; transform:translateX(-50%); border-radius:999px; padding:5px 11px; color:#15181f; background:var(--yellow); font:700 10px ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; box-shadow:0 5px 18px #0006; }
      .frame { max-width:1260px; min-height:700px; margin:0 auto; display:grid; grid-template-columns:185px minmax(480px,1fr) 375px; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#15181f; box-shadow:var(--shadow); }
      .rail { padding:22px 14px; border-right:1px solid var(--line); background:#171a21; } .rail h1 { margin:0 0 26px; font-size:14px; } .rail p { margin:0 0 24px; color:var(--muted); font-size:11px; line-height:1.45; }
      .rail-item { display:flex; gap:9px; align-items:center; width:100%; margin:5px 0; padding:9px 10px; border-radius:8px; color:var(--muted); text-align:left; background:transparent; } .rail-item.active { color:var(--text); background:var(--panel3); } .rail-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); } .active .rail-dot { background:var(--blue); box-shadow:0 0 0 3px #91b9ff22; }
      .workspace { position:relative; padding:23px; overflow:hidden; background:linear-gradient(135deg,#202632,#171a20 72%); } .workspace-head { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; } .workspace-head strong { color:var(--text); font-size:13px; }
      .graph { position:relative; min-height:470px; margin-top:42px; border:1px solid #536071; border-radius:12px; background:#181c24; } .graph-grid { position:absolute; inset:0; opacity:.35; background-image:linear-gradient(#536071 1px,transparent 1px),linear-gradient(90deg,#536071 1px,transparent 1px); background-size:28px 28px; }
      .node { position:absolute; z-index:1; width:208px; border:1px solid #536071; border-radius:10px; background:var(--panel); box-shadow:0 12px 25px #0005; } .node.cue { left:8%; top:21%; width:245px; } .node.scene { right:8%; top:10%; width:175px; } .node.source { right:8%; bottom:13%; width:175px; } .node-head { display:flex; align-items:center; justify-content:space-between; padding:10px 11px; border-bottom:1px solid var(--line); } .node-head strong { font-size:12px; } .node-head small { color:var(--muted); font-size:9px; letter-spacing:.07em; text-transform:uppercase; }
      .cue-row { position:relative; display:grid; grid-template-columns:1fr 18px; gap:8px; align-items:center; padding:10px 11px; border-bottom:1px solid #303743; } .cue-row:last-child { border-bottom:0; } .cue-row.active { background:#91b9ff12; } .cue-row strong { display:block; font-size:11px; } .cue-row small { display:block; margin-top:3px; color:var(--muted); font-size:9px; } .handle { display:block; width:13px; height:13px; border:2px solid var(--blue); border-radius:50%; background:var(--panel); }
      .edge { position:absolute; z-index:0; height:2px; transform-origin:left center; background:var(--blue); opacity:.9; } .edge:after { content:""; position:absolute; right:-1px; top:-4px; border-left:8px solid var(--blue); border-top:5px solid transparent; border-bottom:5px solid transparent; } .edge-nav { left:29%; top:31%; width:39%; transform:rotate(-15deg); } .edge-set { left:29%; top:48%; width:40%; transform:rotate(18deg); background:var(--purple); } .edge-set:after { border-left-color:var(--purple); }
      .edge-label { position:absolute; z-index:2; border-radius:5px; padding:4px 6px; color:#18233a; background:var(--blue2); font:700 9px ui-monospace,monospace; } .edge-label.nav { left:51%; top:22%; } .edge-label.set { left:54%; top:56%; color:#271d41; background:#e6d8ff; }
      .inspector { min-width:0; border-left:1px solid var(--line); background:var(--panel); } .head { display:flex; align-items:flex-start; justify-content:space-between; padding:20px; border-bottom:1px solid var(--line); } .eyebrow { color:var(--muted); font:700 10px ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; } h2 { margin:7px 0 0; font-size:16px; } .close { width:27px; height:27px; border-radius:7px; color:var(--muted); background:transparent; }
      .body { padding:17px 20px; } .section { padding:0 0 17px; margin:0 0 17px; border-bottom:1px solid var(--line); } .section-title { display:flex; justify-content:space-between; margin-bottom:11px; font-size:12px; font-weight:700; } .section-title span { color:var(--muted); font-size:10px; font-weight:500; }
      .info { border-radius:8px; padding:10px; color:var(--muted); background:var(--panel2); font-size:10px; line-height:1.5; } .info b { color:var(--text); } .badge { display:inline-block; border-radius:5px; padding:3px 5px; color:#18233a; background:var(--blue2); font:700 9px ui-monospace,monospace; } .badge.purple { color:#271d41; background:#e6d8ff; }
      label { display:block; margin:11px 0 5px; color:var(--muted); font-size:10px; } select,input { width:100%; border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:var(--text); background:var(--panel2); outline:none; } select:focus,input:focus,button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
      .row { display:flex; align-items:center; gap:8px; } .row > *:first-child { flex:1; } .primary,.quiet,.danger { border-radius:7px; padding:8px 10px; font-size:10px; font-weight:700; } .primary { color:#18233a; background:var(--blue); } .quiet { color:var(--blue2); background:#91b9ff1a; } .danger { color:#f0a9b2; background:#f28e9b16; }
      .action-edge { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:9px; background:var(--panel2); } .edge-icon { display:grid; place-items:center; width:22px; height:22px; border-radius:6px; color:#18233a; background:var(--blue); font:800 10px ui-monospace,monospace; } .edge-icon.source { color:#271d41; background:var(--purple); } .action-edge strong { display:block; font-size:11px; } .action-edge small { display:block; margin-top:3px; color:var(--muted); font-size:9px; }
      .live-state { position:absolute; left:23px; bottom:21px; max-width:295px; border:1px solid #536071; border-radius:8px; padding:10px 12px; color:#505b6c; background:#edf1f7; font:10px/1.45 ui-monospace,monospace; } .live-state b { color:#263245; }
      .switcher { position:fixed; z-index:5; left:50%; bottom:17px; transform:translateX(-50%); display:flex; align-items:center; gap:9px; border:1px solid #606a7a; border-radius:999px; padding:7px 9px; background:#202630ee; box-shadow:0 10px 30px #0008; } .switcher button { width:29px; height:29px; border-radius:50%; color:var(--blue2); background:#91b9ff1a; font-size:16px; } .switcher button:hover { background:#91b9ff35; } .switch-label { min-width:180px; color:var(--text); text-align:center; font:11px ui-monospace,monospace; } .switch-label span { color:var(--muted); }
      .variant-b .frame { grid-template-columns:185px minmax(480px,1fr) 400px; } .variant-b .graph { min-height:505px; } .variant-b .node.cue { left:21%; top:14%; } .variant-b .node.scene { right:12%; top:8%; } .variant-b .node.source { right:12%; bottom:9%; } .variant-b .edge-nav { left:48%; top:27%; width:30%; transform:rotate(-16deg); } .variant-b .edge-set { left:48%; top:51%; width:30%; transform:rotate(16deg); } .variant-b .edge-label.nav { left:67%; top:20%; } .variant-b .edge-label.set { left:66%; top:59%; }
      .variant-c .frame { grid-template-columns:185px minmax(480px,1fr) 405px; } .variant-c .graph { min-height:505px; background:#1a1e27; } .variant-c .node.cue { left:6%; top:12%; width:285px; } .variant-c .node.scene { right:7%; top:8%; } .variant-c .node.source { right:7%; bottom:10%; } .variant-c .edge-nav { left:35%; top:31%; width:33%; transform:rotate(-17deg); } .variant-c .edge-set { left:35%; top:52%; width:34%; transform:rotate(18deg); } .variant-c .edge-label.nav { left:54%; top:20%; } .variant-c .edge-label.set { left:58%; top:61%; }
      @media (max-width:980px) { .shell { padding:22px 12px 100px; } .frame { grid-template-columns:1fr; } .rail { display:none; } .workspace { min-height:650px; } .inspector { border-left:0; border-top:1px solid var(--line); } .live-state { bottom:20px; left:18px; } }
    </style>
  </head>
  <body>
    <div class="flag">Prototype · throwaway</div><main id="app" class="shell"></main>
    <script>
      const variants = [{ key:"A", name:"Cue rows + handles" }, { key:"B", name:"Edge behavior inspector" }, { key:"C", name:"Scene / Block owner view" }];
      const state = { variant:new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A", cue:"Submit vote", binding:true, navTarget:"Results", sourceTarget:"voteCount", sourceMode:"increment", owner:"Scene · Voting", message:"Selected Cue: Submit vote" };
      if (!variants.some((variant) => variant.key === state.variant)) state.variant = "A";
      function setVariant(key) { state.variant=key; const url=new URL(location.href); url.searchParams.set("variant",key); history.replaceState(null,"",url); render(); }
      function cycle(delta) { const index=variants.findIndex((variant) => variant.key===state.variant); setVariant(variants[(index+delta+variants.length)%variants.length].key); }
      function action(name) { if(name==="toggle-binding"){state.binding=!state.binding;state.message=state.binding?"Tap binding restored":"Draft binding removed";} if(name==="new-cue"){state.cue="New cue";state.message="Cue created in current owner";} if(name==="take-block"){state.owner="Block · VoteCard";state.message="Block Cue inherited by Slot; Player dispatch unavailable";} if(name==="toggle-mode"){state.sourceMode=state.sourceMode==="increment"?"set":"increment";state.message=`Source edge behavior: ${state.sourceMode}`;} render(); }
      function esc(value){return String(value).replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));}
      function graph(){return `<div class="graph"><div class="graph-grid"></div><div class="edge edge-nav"></div><div class="edge edge-set"></div><div class="edge-label nav">Navigate</div><div class="edge-label set">${esc(state.sourceMode)}</div><div class="node cue"><div class="node-head"><div><small>Cue node</small><strong>${esc(state.owner.startsWith("Block")?"VoteCard cues":"Voting cues")}</strong></div><button class="quiet" data-action="new-cue">+ Cue</button></div><div class="cue-row active"><div><strong>${esc(state.cue)}</strong><small>tap · 2 outgoing behaviors</small></div><i class="handle" aria-label="Submit vote outgoing handle"></i></div><div class="cue-row"><div><strong>Cancel vote</strong><small>tap · no outgoing behavior</small></div><i class="handle" aria-label="Cancel vote outgoing handle"></i></div></div><div class="node scene"><div class="node-head"><div><small>Scene</small><strong>${esc(state.navTarget)}</strong></div></div><div class="cue-row"><div><strong>Incoming behavior</strong><small>from Submit vote</small></div></div></div><div class="node source"><div class="node-head"><div><small>Source</small><strong>${esc(state.sourceTarget)}</strong></div></div><div class="cue-row"><div><strong>${esc(state.sourceMode)}</strong><small>from Submit vote</small></div></div></div><div class="live-state"><b>Live prototype state</b><br />owner=${esc(state.owner)} · binding=${state.binding}<br />cue=${esc(state.cue)} · source=${esc(state.sourceMode)}<br />last=${esc(state.message)}</div></div>`;}
      function head(title,subtitle){return `<div class="head"><div><div class="eyebrow">${subtitle}</div><h2>${title}</h2></div><button class="close" aria-label="Close inspector">×</button></div>`;}
      function variantA(){return `<section class="inspector">${head("Vote button","Selected Element")}<div class="body"><div class="section"><div class="section-title">Event Binding <span>${state.binding?"tap":"unbound"}</span></div><div class="info"><b>tap</b> on Vote button → <b>${esc(state.cue)}</b><br />Owner is derived from the Canvas: <b>${esc(state.owner)}</b></div><div class="row" style="margin-top:10px"><button class="primary" data-action="toggle-binding">${state.binding?"Remove binding":"Bind tap"}</button><button class="quiet" data-action="new-cue">New Cue</button></div></div><div class="section"><div class="section-title">Cue <span>defined here or in Show graph</span></div><label for="cue-a">Cue name</label><input id="cue-a" value="${esc(state.cue)}" /><p class="hint">Actions are graph edges, not nested controls. Open the Cue in the graph to add or inspect behavior.</p><button class="quiet" style="margin-top:10px">Open Cue in graph</button></div><div class="section"><div class="section-title">Inherited behavior <span>Block fast-follow</span></div><div class="info"><span class="badge purple">Block</span> Cues travel with the Block into each Slot instance. They are authored here, but remain unavailable to Player until Block dispatch exists.</div><button class="quiet" style="margin-top:10px" data-action="take-block">Preview Block owner</button></div></div></section>`;}
      function variantB(){return `<section class="inspector">${head("Submit vote","Selected Cue")}<div class="body"><div class="section"><div class="section-title">Outgoing behavior <span>2 edges</span></div><div class="action-edge"><div class="edge-icon">→</div><div><strong>${esc(state.navTarget)}</strong><small>Scene target · Navigate Action</small></div><button class="quiet">Edit</button></div><div class="action-edge" style="margin-top:8px"><div class="edge-icon source">S</div><div><strong>${esc(state.sourceTarget)}</strong><small>Source target · ${esc(state.sourceMode)} value</small></div><button class="quiet" data-action="toggle-mode">${state.sourceMode}</button></div><button class="primary" style="margin-top:12px">Add outgoing edge</button></div><div class="section"><div class="section-title">Behavior rule</div><div class="info"><span class="badge">Scene edge</span> Cue → Scene defines navigation.<br /><span class="badge purple">Source edge</span> Cue → Source defines value behavior.</div><label for="target-b">Scene target</label><select id="target-b"><option>${esc(state.navTarget)}</option><option>Waiting</option><option>Voting</option></select><label for="source-b">Source target</label><select id="source-b"><option>${esc(state.sourceTarget)}</option><option>totalVotes</option><option>lastChoice</option></select></div><div class="section"><div class="section-title">Owner <span>${esc(state.owner)}</span></div><p class="hint">Cues can be created from this inspector or the Show graph. The edge is the Action; there is no second Action list to keep synchronized.</p></div></div></section>`;}
      function variantC(){return `<section class="inspector">${head("VoteCard","Block Canvas")}<div class="body"><div class="section"><div class="section-title">Cues inherited by Slot <span>2 available</span></div><div class="info"><span class="badge purple">Block Cue</span> VoteCard cues are defined once on the Block, then appear in every Slot instance.</div><div class="cue-row active" style="border:1px solid var(--line);border-radius:8px;margin-top:10px"><div><strong>${esc(state.cue)}</strong><small>tap · inherited from Block</small></div><i class="handle" aria-label="Inherited Cue outgoing handle"></i></div><div class="cue-row" style="border:1px solid var(--line);border-radius:8px;margin-top:7px"><div><strong>Cancel vote</strong><small>tap · inherited from Block</small></div><i class="handle" aria-label="Inherited cancel Cue outgoing handle"></i></div></div><div class="section"><div class="section-title">Instance boundary</div><div class="info"><b>Block</b> is abstract here. Its Cue edges become meaningful only after the Block is placed in a Slot. No per-instance action editing is needed.</div><button class="quiet" style="margin-top:10px">Open Block graph</button></div><div class="section"><div class="section-title">Current runtime <span>explicit</span></div><div class="info"><span class="badge purple">Unavailable in Player</span><br />This is authored and persisted configuration. Runtime Block dispatch is a separate future seam.</div></div></div></section>`;}
      function render(){const variant=variants.find((item)=>item.key===state.variant);const inspector=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();document.querySelector("#app").innerHTML=`<div class="frame variant-${state.variant.toLowerCase()}"><aside class="rail"><h1>Mechanē</h1><p>Show / Navigation Proof</p><button class="rail-item"><i class="rail-dot"></i>Show graph</button><button class="rail-item active"><i class="rail-dot"></i>Canvas</button><button class="rail-item"><i class="rail-dot"></i>Runs</button><div style="height:24px"></div><div class="eyebrow">Artboards</div><button class="rail-item active" style="margin-top:10px"><i class="rail-dot"></i>Voting</button><button class="rail-item"><i class="rail-dot"></i>VoteCard</button></aside><section class="workspace"><div class="workspace-head"><div><strong>Show graph</strong><br /><span>Cues and behavior edges</span></div><span>Draft</span></div>${graph()}</section>${inspector}</div><div class="switcher"><button data-cycle="-1" aria-label="Previous variant">‹</button><div class="switch-label">${variant.key} · ${variant.name}<br /><span>← / → to compare</span></div><button data-cycle="1" aria-label="Next variant">›</button></div>`;document.querySelectorAll("[data-action]").forEach((button)=>button.addEventListener("click",()=>action(button.dataset.action)));}
      document.addEventListener("keydown",(event)=>{const tag=document.activeElement?.tagName;if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||document.activeElement?.isContentEditable)return;if(event.key==="ArrowLeft"){event.preventDefault();cycle(-1);}if(event.key==="ArrowRight"){event.preventDefault();cycle(1);}});render();
    </script>
  </body>
</html>
