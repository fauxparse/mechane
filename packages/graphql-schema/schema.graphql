scalar JSON

type User {
  id: ID!
  name: String!
  email: String!
  emailVerified: Boolean!

  """
  The user's system role (@mechane/domain/access-control), e.g. user or admin.
  """
  role: String!
}

"""
The signed-in user's preferences: their design-system theme (PRD.md §7) and Studio behavior.
"""
type UserSettings {
  """Display mode: light or dark."""
  themeMode: String!

  """Which built-in theme is active."""
  themePalette: String!

  """
  Whether closing the last Studio window on a live Show asks to end its Run first.
  """
  askToEndRunOnClose: Boolean!
}

type Query {
  """The signed-in user, or null if the request has no valid session."""
  me: User

  """
  The admin impersonating the signed-in user in this session, or null when the
  session is the user's own. While impersonating, `me` is the impersonated user.
  """
  impersonator: User

  """
  The signed-in user's settings, or defaults if they haven't set any yet.
  """
  userSettings: UserSettings!

  """The signed-in user's own Shows, most recently updated first."""
  shows: [Show!]!

  """
  A single Show owned by the signed-in user, or null if it doesn't exist or isn't theirs.
  """
  show(id: ID!): Show

  """The active Run for a Show, or null when the Show is stopped."""
  activeRun(showId: ID!): Run

  """
  A Show's Run error log, newest first. Covers failures from every Run and
  from before any Run started; `runId` narrows it to one Run and `category`
  to one kind of failure.
  """
  runErrors(showId: ID!, runId: ID, category: String, limit: Int): [RunError!]!

  """
  A grant to the Show's realtime channel, where a Studio window hears that
  a Device is waiting for the Show to start and that a Run started or ended.
  """
  showRealtime(showId: ID!): RealtimeGrant!

  """
  A public Device snapshot resolved by the pairing bearer credential.
  Invalid credentials return null. `connecting` marks the read a Player
  makes as it connects, as opposed to a refresh; a Device connecting to a
  Show with no Run asks the Show's Studio windows to start it.
  """
  playerSession(connecting: Boolean): PlayerSession

  """
  The Run values for the Device the pairing bearer credential names, read
  without the rest of its session. Null when the credential is invalid or
  no Run is active; a Player reads its whole session to find out which.
  """
  playerRunState: PlayerRunState

  """
  A fresh realtime grant for the Device the pairing bearer credential
  names, without the rest of its session. Null when the credential is invalid.
  """
  playerRealtimeGrant: RealtimeGrant
  variableReferences(showId: ID!, variableId: ID!, state: String): [VariableReference!]!
  showGraph(showId: ID!, state: String): ShowGraph!
  showCanvases(showId: ID!, state: String): [Artboard!]!
  imageAssets(showId: ID!): [ImageAsset!]!

  """
  Every Show the given user owns, most recently updated first. Requires the show:list permission.
  """
  userShows(userId: ID!): [Show!]!

  """
  The signed-in user's Custom Domains, or only those bound to one of their Show's Devices.
  """
  customDomains(showId: ID): [CustomDomain!]!

  """
  The signed-in user's Custom Domains bound to no Device, for bringing one to a Device.
  """
  unboundCustomDomains: [CustomDomain!]!

  """
  Custom Domains at or under a hostname, or owned by the user with an email
  address. Requires the customDomain:list permission.
  """
  adminCustomDomains(hostname: String, ownerEmail: String): [AdminCustomDomain!]!

  """
  The active block covering a hostname, if any. Requires customDomain:list.
  """
  hostnameBlock(hostname: String!): BlockedHostname
}

type Mutation {
  updateUserSettings(themeMode: String, themePalette: String, askToEndRunOnClose: Boolean): UserSettings!
  createShow(name: String!): Show!
  renameShow(id: ID!, name: String!): Show!

  """
  Turns auto-publication on or off. Turning it on publishes any unpublished draft.
  """
  setShowAutoPublish(id: ID!, autoPublish: Boolean!): Show!
  deleteShow(id: ID!): Boolean!
  endRun(showId: ID!): Run
  startRun(showId: ID!): Run!
  reshuffleTransformer(showId: ID!, transformerId: ID!, deviceId: ID): Boolean!
  submitPlayerEvent(input: PlayerEventInput!): PlayerEventResult!
  applyShowEdits(showId: ID!, baseVersion: Int!, edits: [ShowEditInput!]!): AppliedShowEdits!
  publishShowGraph(showId: ID!): ShowGraph!
  beginImageUpload(showId: ID!, mimeType: String!, byteLength: Int!): ImageUploadSession!
  completeImageUpload(sessionId: ID!): ImageUploadCandidate!
  finalizeImageUpload(sessionId: ID!, name: String!): ImageAsset!
  renameImageAsset(showId: ID!, assetId: ID!, name: String!): ImageAsset!
  abortImageUpload(sessionId: ID!): Boolean!
  deleteImageAsset(showId: ID!, assetId: ID!): Boolean!

  """
  Adds a person to the waitlist. Always true on success, including when the
  address is already listed, so the response does not reveal who else has
  signed up; a repeat sign-up keeps the name given first, so knowing an
  address is not enough to rename its entry. Refused with the RATE_LIMITED
  error code once one client network has made too many attempts within the
  hour.
  """
  joinWaitlist(name: String!, email: String!): Boolean!

  """Deletes any user's Show. Requires the show:delete permission."""
  adminDeleteShow(id: ID!): Boolean!

  """
  Adds a Custom Domain bound to a saved Device of one of the user's Shows.
  Refused with HOSTNAME_REFUSED (extensions.reason), HOSTNAME_BLOCKED,
  CUSTOM_DOMAIN_CAP_REACHED, or RATE_LIMITED (extensions.hoursLeft).
  """
  addCustomDomain(hostname: String!, showId: ID!, deviceId: ID!): CustomDomain!

  """
  Binds a domain to a saved Device straight away, outside the draft. A
  domain the Device already has is unbound. Revoked domains can't be bound.
  """
  bindCustomDomain(id: ID!, showId: ID!, deviceId: ID!): CustomDomain!
  unbindCustomDomain(id: ID!): CustomDomain!

  """
  Removes the domain from the hosting provider and deletes it, freeing the hostname.
  """
  removeCustomDomain(id: ID!): Boolean!

  """
  Checks the domain now, dormant or not. RATE_LIMITED within 30 seconds of the last.
  """
  checkCustomDomainNow(id: ID!): CustomDomain!

  """
  Blocks a hostname and revokes every Custom Domain at or under it, removing
  each from the hosting provider and emailing its owner the reason.
  Requires customDomain:revoke.
  """
  revokeCustomDomain(hostname: String!, reason: String!): [AdminCustomDomain!]!

  """
  Blocks a hostname and its subdomains, added or not. Requires customDomain:block.
  """
  blockHostname(hostname: String!, reason: String!): BlockedHostname!

  """
  Lifts the block on a hostname, returning the Revoked domains beneath it to
  Unverified. Requires customDomain:unblock.
  """
  unblockHostname(hostname: String!): BlockedHostname!
}

type Show {
  id: ID!
