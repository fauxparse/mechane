type User {
  id: ID!
  name: String!
  email: String!
  emailVerified: Boolean!
}

type Show {
  id: ID!
  name: String!
  createdAt: String!
  updatedAt: String!
}

type Run {
  id: ID!
  showId: ID!
  status: String!
  startedAt: String!
  endedAt: String
  sourceValues: JSON!
}

type PlayerDevice {
  id: ID!
  name: String!
  perConnection: Boolean!
}

type PlayerSession {
  device: PlayerDevice!
  run: Run
  graph: ShowGraph!
  scene: SceneNode
  canvas: Canvas
  imageAssets: [ImageAsset!]!
}

"""The signed-in user's design-system preference (PRD.md §7)."""
type UserSettings {
  """Display mode: light or dark."""
  themeMode: String!

  """Which built-in theme is active."""
  themePalette: String!
}

"""
Free-form canvas coordinates for a graph node (issue #25 — no auto-layout).
"""
type Position {
  x: Float!
  y: Float!
}

"""
A named port on a Scene. A wiring edge targets one of these, not the Scene as a whole.
"""
type SceneVariable {
  id: ID!
  name: String!
  rank: String
  type: Type
  suggestedDimensions: SuggestedImageDimensions
}

type SuggestedImageDimensions {
  width: Int!
  height: Int!
}

scalar JSON

"""
A recursive Type descriptor: primitive, array, or a named Shape reference.
"""
type Type {
  kind: String!
  of: Type
  shapeId: ID
}

input TypeInput {
  kind: String!
  of: TypeInput
  shapeId: ID
}

type TextValue {
  value: String!
}

type NumberValue {
  value: Float!
}

type BooleanValue {
  value: Boolean!
}

type ImageValue {
  assetId: ID!
  url: String!
  width: Int!
  height: Int!
  alt: String!
  mimeType: String!
  blurHash: String
}

type ColorValue {
  value: String!
}

type DateValue {
  value: String!
}

type DateTimeValue {
  value: String!
}

type ObjectValue {
  value: JSON!
}

type ArrayValue {
  value: JSON!
}

union ShapeValue = TextValue | NumberValue | BooleanValue | ImageValue | ColorValue | DateValue | DateTimeValue | ObjectValue | ArrayValue

input ImageValueInput {
  assetId: ID!
}

input ShapeValueInput @oneOf {
  text: String
  number: Float
  boolean: Boolean
  image: ImageValueInput
  color: String
  date: String
  datetime: String
  array: JSON
}

type ShapeField {
  id: ID!
  name: String!
  type: Type!
  position: Int!
  required: Boolean!
  default: ShapeValue
}

input ShapeFieldInput {
  id: ID!
  name: String!
  type: TypeInput!
  position: Int!
  required: Boolean!
  defaultValue: JSON
}

type Shape {
  id: ID!
  name: String!
  fields: [ShapeField!]!
}

type BlockVariable {
  id: ID!
  name: String!
  type: Type!
  required: Boolean!
  defaultValue: JSON
}

type BlockStateOverride {
  elementId: ID!
  property: String!
  value: JSON
}

type BlockState {
  id: ID!
  name: String!
  isDefault: Boolean!
  overrides: [BlockStateOverride!]!
}

type Block {
  id: ID!
  name: String!
  canvas: Canvas!
  variables: [BlockVariable!]!
  states: [BlockState!]!
  stateSelectorVariableId: ID
}

input ShapeInput {
  id: ID!
  name: String!
  fields: [ShapeFieldInput!]!
}

type SourceFieldDefault {
  nodeId: ID!
  fieldPath: [ID!]!
  value: JSON
}

"""
The fields shared by every node on the Show graph. Kind-specific data is
exposed by the concrete node types below; clients use __typename rather
than a nullable field bag and a string discriminator.
"""
interface GraphNode {
  id: ID!
  name: String!

  """The Flow containing this node, or null if it's Show-level."""
  parentId: ID
  position: Position!

  """
  The node editor colorway; absent values are neutral or inherit their Flow.
  """
  color: String
}

type SceneNode implements GraphNode {
  id: ID!
  name: String!
  parentId: ID
  position: Position!
  color: String

  """The Variables wiring edges can target."""
  variables: [SceneVariable!]!
}

type FlowNode implements GraphNode {
  id: ID!
  name: String!
  parentId: ID
  color: String
  position: Position!

  """The Flow's design-time entry Scene, if one is set."""
  defaultSceneId: ID
}

type SourceNode implements GraphNode {
  id: ID!
  name: String!
  parentId: ID
  position: Position!
  color: String
  type: Type!

  """Sparse default overrides for Source fields, keyed by stable field ids."""
  fieldDefaults: [SourceFieldDefault!]!
}

type TransformerNode implements GraphNode {
  id: ID!
  name: String!
  parentId: ID
  position: Position!
  color: String
  type: Type
}

type DeviceNode implements GraphNode {
  id: ID!
  name: String!
  parentId: ID
  position: Position!
  color: String

  """Whether each connection is its own logical instance."""
  perConnection: Boolean!

  """The server-minted pairing code, absent before the first save."""
  pairingCode: String
}

"""
The fields shared by every edge on the Show graph. Edge-specific data is
exposed by the concrete edge types below; clients use __typename rather
than a nullable field bag and a string discriminator.
"""
interface GraphEdge {
  id: ID!
  sourceId: ID!
  targetId: ID!
  sourcePath: [String!]!
  targetPath: [String!]!
}

type WiringEdge implements GraphEdge {
  id: ID!
  sourceId: ID!
  targetId: ID!
  sourcePath: [String!]!
  targetPath: [String!]!

  """Resolved stable field-id mapping."""
  fieldMapping: JSON

  """The Scene Variable this edge feeds — the head of targetPath."""
  targetVariableId: ID
}

type NavigateEdge implements GraphEdge {
  id: ID!
  sourceId: ID!
  targetId: ID!
  sourcePath: [String!]!
  targetPath: [String!]!

  """The Cue/Action pairing this transition represents."""
  cueId: ID
  actionId: ID
}

type DeviceEdge implements GraphEdge {
  id: ID!
  sourceId: ID!
  targetId: ID!
  sourcePath: [String!]!
  targetPath: [String!]!
}

type PublishLoss {
  sourceId: ID!
  fieldId: ID!
  fieldName: String!
  path: [String!]!
  reason: String!
}

"""
A Show's graph in one state. Draft and published are independently readable (ADR-0002).
"""
type ShowGraph {
  showId: ID!

  """Either draft or published."""
  state: String!
  nodes: [GraphNode!]!
  edges: [GraphEdge!]!
  shapes: [Shape!]!
  blocks: [Block!]!

  """Sparse graph-owned Source values, keyed by Source node and field path."""
  sourceFieldDefaults: [SourceFieldDefault!]!
  updatedAt: String!

  """
  How many times this graph has been written. An edit batch names the
  version it was composed against, and is refused if that isn't the
  version stored — see `applyShowGraphEdits`.
  """
  version: Int!

  """Fields that lost data while this graph was published."""
  losses: [PublishLoss!]!
}

"""
A persisted Scene or Block Canvas. Element is an interface so clients can
select the primitive-specific content without a nullable field bag.
"""
type Canvas {
  id: ID!
  kind: String!
  position: Position!
  ownerId: ID!
  ownerName: String!
  root: Element!
}

interface Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
}

type RectElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
  cornerRadius: JSON
}

type EllipseElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
}

type TextElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
  content: JSON
  text: JSON
  color: JSON
  fontFamily: JSON
  fontSize: JSON
  fontWeight: JSON
  fontStyle: JSON
  textDecoration: JSON
  lineHeight: JSON
  letterSpacing: JSON
  textVerticalAlign: JSON
  textOverflow: String
  padding: JSON
}

type ImageElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
  image: JSON
  alt: JSON
  objectFit: JSON
}

type FrameElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
  cornerRadius: JSON
  layoutMode: String
  autoLayout: Boolean
  direction: String
  gap: JSON
  padding: JSON
  alignPrimary: String
  alignCounter: String
  primaryAlign: String
  counterAlign: String
  clip: Boolean
}

type SlotElement implements Element {
  id: ID!
  name: String
  parentId: ID
  rank: String!
  hidden: Boolean!
  layout: JSON
  sizing: JSON
  rotation: Int
  opacity: JSON
  blendMode: String
  fill: JSON
  stroke: JSON
  anchor: JSON
  children: [Element!]!
  layoutMode: String
  autoLayout: Boolean
  direction: String
  gap: JSON
  padding: JSON
  alignPrimary: String
  alignCounter: String
  primaryAlign: String
  counterAlign: String
  clip: Boolean
  blockId: ID!
}

input PositionInput {
  x: Float!
  y: Float!
}

input SuggestedImageDimensionsInput {
  width: Int!
  height: Int!
}

input SceneVariableInput {
  id: ID!
  name: String!
  rank: String
  type: TypeInput
  suggestedDimensions: SuggestedImageDimensionsInput
}

input GraphNodeInput {
  id: ID!
  kind: String!
  name: String!
  parentId: ID
  defaultSceneId: ID
  color: String
  type: TypeInput
  position: PositionInput!
  variables: [SceneVariableInput!]

  """
  Device nodes only: whether each connection is its own instance.
  Defaults to false for a new Device. There is no pairingCode input:
  codes are minted server-side.
  """
  perConnection: Boolean
}

input GraphEdgeInput {
  id: ID!
  kind: String!
  sourceId: ID!
  targetId: ID!
  sourcePath: [String!]
  targetPath: [String!]
  fieldMapping: JSON
  cueId: ID
  actionId: ID
}

type GraphEdit {
  type: String!
  nodeId: ID
  node: GraphNode
  edgeId: ID
  edge: GraphEdge
  position: Position
  parentId: ID

  """The Shape target for shape commands."""
  shapeId: ID
  shape: Shape

  """The Shape Field target for shape commands."""
  fieldId: ID
  field: ShapeField
  fieldType: Type
  defaultValue: JSON
  required: Boolean

  """The Show node editor colorway for graph.setNodeColor."""
  color: String

  """The Source node Type, for graph.setSourceType."""
  sourceType: Type

  """The graph-owned Source field path for graph.setSourceFieldDefault."""
  fieldPath: [ID!]

  """The wiring edge's stable source-field to target-field mapping."""
  fieldMapping: JSON

  """The graph-owned Source field value; null clears the override."""
  value: JSON

  """The Block target for Block lifecycle commands."""
  block: Block
  blockId: ID

  """
  Devices only: the code the server minted for a Device this batch created (#45).
  """
  pairingCode: String

  """
  Devices only: whether each connection is its own instance, for graph.setDevicePerConnection.
  """
  perConnection: Boolean
}

"""
One serialisable Show edit. `type` selects a graph or Canvas command;
Canvas commands additionally name the Canvas they target.
"""
input ShowEditInput {
  type: String!
  canvasId: ID
  nodeId: ID
  node: GraphNodeInput
  edgeId: ID
  edge: GraphEdgeInput
  color: String

  """Block lifecycle payloads are validated by the domain boundary."""
  block: JSON
  blockId: ID
  position: PositionInput
  parentId: ID
  name: String
  flowId: ID
  sceneId: ID
  variableId: ID
  variableIds: [ID!]
  variable: SceneVariableInput

  """Shape command target and materialised payloads."""
  shapeId: ID
  shape: ShapeInput
  fieldId: ID
  field: ShapeFieldInput
  fieldType: TypeInput
  defaultValue: JSON
  required: Boolean

  """The Variable's Type, for graph.setSceneVariableType. Null clears it."""
  shapes: [ShapeInput!]

  """The Variable's Type, for graph.setSceneVariableType. Null clears it."""
  variableType: TypeInput

  """The Source node Type, for graph.setSourceType."""
  sourceType: TypeInput

  """The Source field path, for graph.setSourceFieldDefault."""
  fieldPath: [ID!]

  """The wiring edge's stable source-field to target-field mapping."""
  fieldMapping: JSON

  """The Source field value; null clears the override."""
  value: JSON
  elementId: ID
  rank: String
  element: JSON
  properties: JSON
  unsetProperties: [String!]

  """
  Devices only: whether each connection is its own instance, for graph.setDevicePerConnection.
  """
  perConnection: Boolean
}

type AppliedShowEdits {
  showId: ID!
  state: String!
  updatedAt: String!
  version: Int!
  canvas: Canvas
  amendments: [GraphEdit!]!
}

type ImageUploadConstraints {
  maxSourceBytes: Int!
  maxPixels: Int!
  maxAxis: Int!
  maxNormalizedBytes: Int!
  sessionTtlMs: Int!
  candidateTtlMs: Int!
}

type ImageUploadPlan {
  method: String!
  url: String!
  requiredHeaders: JSON!
}

type ImageUploadSession {
  id: ID!
  expiresAt: String!
  constraints: ImageUploadConstraints!
  plan: ImageUploadPlan!
}

type ImageUploadCandidate {
  sessionId: ID!
  digest: String!
  byteLength: Int!
  mimeType: String!
}

type ImageAsset {
  id: ID!
  revision: String!
  url: String!
  width: Int!
  height: Int!
  mimeType: String!
  alt: String!
  blurHash: String
}

type Query {
  """The signed-in user, or null if the request has no valid session."""
  me: User

  """
  A public Device snapshot resolved by its pairing code. The code is the
  Device credential; no signed-in session is required.
  """
  playerSession(pairingCode: String!): PlayerSession

  """The signed-in user's own Shows, most recently updated first."""
  shows: [Show!]!

  """
  A single Show owned by the signed-in user, or null if it doesn't exist or isn't theirs.
  """
  show(id: ID!): Show

  """
  The signed-in user's theme settings, or PRD.md §7 defaults if they haven't set any yet.
  """
  userSettings: UserSettings!

  """The active Run for a Show, or null when the Show is stopped."""
  activeRun(showId: ID!): Run
  showGraph(showId: ID!, state: String): ShowGraph!
  showCanvases(showId: ID!, state: String): [Canvas!]!
  sceneCanvas(showId: ID!, sceneNodeId: ID!, state: String): Canvas
  blockCanvas(showId: ID!, blockId: ID!, state: String): Canvas
  imageAssets(showId: ID!): [ImageAsset!]!
}

type Mutation {
  createShow(name: String!): Show!
  renameShow(id: ID!, name: String!): Show!
  deleteShow(id: ID!): Boolean!
  updateUserSettings(themeMode: String, themePalette: String): UserSettings!
  applyShowEdits(showId: ID!, baseVersion: Int!, edits: [ShowEditInput!]!): AppliedShowEdits!
  publishShowGraph(showId: ID!): ShowGraph!
  endRun(showId: ID!): Run
  startRun(showId: ID!): Run!
  beginImageUpload(showId: ID!, mimeType: String!, byteLength: Int!): ImageUploadSession!
  completeImageUpload(sessionId: ID!): ImageUploadCandidate!
  finalizeImageUpload(sessionId: ID!, alt: String): ImageAsset!
  abortImageUpload(sessionId: ID!): Boolean!
  deleteImageAsset(showId: ID!, assetId: ID!): Boolean!
}
