  action: ActionInput
  binding: EventBindingInput

  """Event Binding key payloads: graph.setEventBindingKey."""
  key: String
  cueId: ID
  actionId: ID
  bindingId: ID
  bindingIds: [ID!]
  actionIds: [ID!]

  """Update Action target and operation payloads."""
  target: JSON
  operation: JSON
  operand: JSON
  targetSceneId: ID
  elementId: ID
  rank: String
  element: JSON
  properties: JSON
