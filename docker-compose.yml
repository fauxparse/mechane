services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mechane
      POSTGRES_PASSWORD: mechane
      POSTGRES_DB: mechane
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mechane -d mechane"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mechane-postgres-data:/var/lib/postgresql/data

volumes:
  mechane-postgres-data:
