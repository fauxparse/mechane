services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mechane
      POSTGRES_PASSWORD: mechane
      POSTGRES_DB: mechane
    ports:
      - "5432:5432"
    volumes:
      - mechane-postgres-data:/var/lib/postgresql/data

volumes:
  mechane-postgres-data:
